# 进阶：magpie 单独一个容器 / advanced: magpie in its own container.
# 一般用 compose.yml 就够了；这一份用 `docker compose -f compose.split.yml up -d`。
#
#
#   cp .env.example .env        # 填 TELEGRAM_BOT_TOKEN 和 WEB_PASSWORD
#   docker compose -f compose.split.yml up -d        # 在仓库根目录跑；.env 就在这个文件旁边
#
# magpie 只在内部网络里，不对外开端口；对外只有网页聊天。
#
# 容器里的 magpie 要自己的 key（本机跑的时候不用）：
#   docker compose -f compose.split.yml exec magpie /magpie gateway-key add bot
# 把打印出来的 sk-magpie-key-… 写进 .env 的 MAGPIE_API_KEY，再 up -d 一次（都带 -f compose.split.yml）。
#
# 新起来的 magpie 里还没有免费路线，开一次：
#   docker compose -f compose.split.yml exec magpie \
#     /magpie plugin add https://github.com/mu-zi-lee/magpie-our-free-model
#   docker compose -f compose.split.yml exec -it magpie /magpie plugin login our-free-model   # 菜单选 1
#   docker compose -f compose.split.yml exec magpie \
#     /magpie group add free 'models=our-free-model/*' routing=smart
# 然后 docker compose -f compose.split.yml restart bot
services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    restart: unless-stopped
    volumes:
      - magpie-config:/config
    # 镜像里没有 shell，只有 magpie 自己；它就是现成的探针
    healthcheck:
      test: ["CMD", "/magpie", "healthcheck", "--addr", "127.0.0.1:3425"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      magpie:
        condition: service_healthy
    environment:
      MAGPIE_BASE_URL: http://magpie:3425
      MAGPIE_API_KEY: ${MAGPIE_API_KEY:-}
      MAGPIE_MODEL: ${MAGPIE_MODEL:-group/free}
      # 容器默认是 UTC；提醒和时间都按这个算
      TZ: ${TZ:-Asia/Shanghai}
      # magpie 是另一个容器，bot 只连它，不自己再起一个
      MAGPIE_START: "0"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-feishu}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
    ports:
      # 只给这台机器。要从别处打开，把 .env 里的 WEB_BIND 改成 0.0.0.0，并且一定设 WEB_PASSWORD
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8787}:8787"
    volumes:
      - bot-data:/data

volumes:
  magpie-config:
  bot-data:
