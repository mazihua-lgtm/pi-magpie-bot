# 云端 / 服务器一键起来 / one container, everything inside:
#
#   cp .env.example .env     # 至少填 WEB_PASSWORD；要接 Telegram 等再填对应几行
#   docker compose up -d
#
# 打开 http://<服务器地址>:8787 ，输入 WEB_PASSWORD 进去聊天。
# 容器里的 bot 自己带着 magpie（第一次启动会下载，要几分钟），所以没有
# 网关密钥、没有 exec 命令要敲；没有模型时网页上有个框，贴上自己的 key 就行。
#
# magpie 单独一个容器的老办法在 compose.split.yml。
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MAGPIE_MODEL: ${MAGPIE_MODEL:-group/free}
      # 容器默认是 UTC；提醒和时间都按这个算
      TZ: ${TZ:-Asia/Shanghai}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-feishu}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
    ports:
      # 只给这台机器。要从别处打开，把 .env 里的 WEB_BIND 改成 0.0.0.0，并且一定设 WEB_PASSWORD
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8787}:8787"
    volumes:
      # 对话、记忆、定时任务，以及 magpie 的 key 和路由，都在这一个卷里
      - data:/data

volumes:
  data:
